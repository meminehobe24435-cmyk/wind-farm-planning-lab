name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # 代码与输出全部是中文，Windows/容器上必须显式指定 UTF-8，否则会 UnicodeEncodeError
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（仅 numpy + pytest）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 运行单元测试
        run: python -m pytest tests -q

  demo:
    name: 端到端 demo（真实产物检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 跑端到端示例
        run: python scripts/demo.py
      - name: 校验产物非空
        run: |
          python - <<'PY'
          import pathlib, sys
          files = sorted(pathlib.Path("reports").iterdir())
          print("产物数量:", len(files))
          bad = [p.name for p in files if p.is_file() and p.stat().st_size == 0]
          if bad:
              print("空文件:", bad); sys.exit(1)
          print("全部产物非空 OK")
          PY
      - name: 上传报告产物
        uses: actions/upload-artifact@v4
        with:
          name: windlab-reports
          path: reports/
